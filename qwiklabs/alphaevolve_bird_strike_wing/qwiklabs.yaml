schema_version: 2
entity_type: Lab
default_locale: en
title: "Optimizing Aerospace Wing Bird-Strike Protection with AlphaEvolve HPC and OpenRADIOSS"
description: "Deploy and run a 10-evaluation evolutionary aerospace wing leading-edge bird-strike optimization on Google Cloud using AlphaEvolve HPC, Cluster Toolkit, Cloud Batch, and OpenRADIOSS."
duration: 60
level: intermediate
environment:
  resources:
    - type: gcp_project
      id: primary_project
      variant: gcpd_no_vpc3
    - type: gcp_user
      id: primary_user
      permissions:
        - project: primary_project
          roles:
            - roles/owner

assessment:
  passing_percentage: 80
  steps:
    - title: "Configure your environment and create the AlphaEvolve Cloud Storage bucket"
      locale_id: step_1
      maximum_score: 20
      student_messages:
        success: "Great job! You completed: Configure your environment and create the AlphaEvolve Cloud Storage bucket"
        incomplete: "Expected Cloud Storage bucket ending in -alphaevolve-bucket not found."
      services:
        - primary_project.StorageV1
      method_name: step_1_check
      code: |-
        # Qwiklabs Activity Tracking Step 1: Configure your environment and create the AlphaEvolve Cloud Storage bucket
        # Runtime: Teacups (Cloud Run NsJail sandbox, read-only filesystem)

        def check(handles:, maximum_score:, resources:)
          storage = handles['primary_project.StorageV1']
          project_id = resources.dig('primary_project', 'project_id') || resources.dig(:primary_project, :project_id) || ''
          ret_hash = { done: false, score: 0, message: 'Checking Cloud Storage for step 1', student_message: 'incomplete' }

          buckets = storage.list_buckets(project_id, freeze_args: true)&.items || []
          target_bucket = buckets.find { |b| b.name.to_s.include?('-alphaevolve-bucket') }
          if target_bucket
            ret_hash = {
              done: true,
              score: maximum_score,
              message: "Assessment Completed! Found bucket #{target_bucket.name}.",
              student_message: 'success'
            }
          else
            ret_hash[:message] = 'Expected Cloud Storage bucket ending in -alphaevolve-bucket not found.'
          end
          ret_hash
        rescue StandardError => e
          {
            done: false,
            score: 0,
            message: "Activity tracking error in step 1: #{e.message.to_s.force_encoding('UTF-8').scrub}",
            student_message: 'incomplete'
          }
        end

        def step_1_check(handles:, maximum_score:, resources:)
          check(handles: handles, maximum_score: maximum_score, resources: resources)
        end
    - title: "Deploy the AlphaEvolve base infrastructure with Cluster Toolkit"
      locale_id: step_2
      maximum_score: 20
      student_messages:
        success: "Great job! You completed: Deploy the AlphaEvolve base infrastructure with Cluster Toolkit"
        incomplete: "Expected config/variables-infra.env in the AlphaEvolve Cloud Storage bucket."
      services:
        - primary_project.StorageV1
      method_name: step_2_check
      code: |-
        # Qwiklabs Activity Tracking Step 2: Deploy the AlphaEvolve base infrastructure with Cluster Toolkit
