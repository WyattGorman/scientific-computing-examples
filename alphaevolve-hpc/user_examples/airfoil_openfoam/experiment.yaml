title: "2D Airfoil OpenFOAM Optimization"
problem_description: |
  Evolve the `optimize_airfoil(parameters, max_successful_simulations=16, max_total_simulations=100)` algorithm in Python to discover the optimal 6 Kulfan Class-Shape Transformation (CST) parameters of a 2D airfoil that maximizes the Lift-to-Drag ratio (`Cl / Cd`) when evaluated by OpenFOAM-14 steady-state incompressible RANS CFD simulations (`tutorials/incompressibleFluid/airFoil2D`).

  Physics & Flow Conditions (`airFoil2D` default):
  - Freestream velocity: `U = (25.75, 3.62, 0.0)` m/s (`|U| = 26.003` m/s, angle of attack `AoA = 8.0024` deg).
  - Kinematic viscosity: `nu = 1.0e-5` m^2/s (`Re = 2.6e6` for unit chord `c = 1.0` m).
  - Turbulence model: Spalart-Allmaras (`nuTilda = 0.14`, `nut = 0.14`), steady-state SIMPLE solver (`incompressibleFluid`).
  - Meshing: Each candidate airfoil is meshed into a 6-block structured C-grid (`system/blockMeshDict`) with curved B-spline surfaces and validated via `blockMesh` and `checkMesh` prior to running `foamRun`.

  Parameterization & Structural Constraints:
  - `best_x` must be a 1D NumPy array of shape `(6,)` strictly within `BOUNDS`:
    - `x[0] = w_l0 in [-0.35, -0.05]`: Lower surface leading-edge nose weight.
    - `x[1] = w_l1 in [-0.30,  0.20]`: Lower surface mid-chord weight (positive creates a concave high-lift lower cove).
    - `x[2] = w_l2 in [-0.30,  0.25]`: Lower surface aft weight (positive creates a rear-loaded reflex/cove).
    - `x[3] = w_u0 in [ 0.08,  0.50]`: Upper surface leading-edge suction weight.
    - `x[4] = w_u1 in [ 0.05,  0.55]`: Upper surface mid-chord camber arch weight.
    - `x[5] = w_u2 in [ 0.05,  0.50]`: Upper surface aft pressure-recovery weight.
  - Surface coordinates on `x/c in [0, 1]` follow `y(x) = sqrt(x) * (1 - x) * (w_0*(1-x)^2 + 2*w_1*x*(1-x) + w_2*x^2)`.
  - Structural thickness rules (checked in microseconds via `check_geometry(x)` without consuming an OpenFOAM slot):
    - Minimum interior thickness `y_u(x) - y_l(x) >= 0.002` on `x/c in [0.01, 0.99]`.
    - Maximum chordwise thickness `0.08 <= max_thickness <= 0.24` (`8% <= t/c <= 24%`).
  - Simulation Budget & Parallel Execution:
    - Each candidate program evaluation can execute up to `max_successful_simulations = 16` converged OpenFOAM-14 simulations (`funct(x, parameters)` returns `-Cl/Cd` for minimization, or `0.0` on failure).
    - Use `evaluate_batch(candidates, parameters, max_workers=4)` to evaluate batches of CST candidates concurrently across CPU cores, and combine analytical aerodynamic priors (thin-airfoil camber/circulation vs. upper-surface pressure-recovery drag) with surrogate modeling (GP/RBF/quadratic response surface) or trust-region refinement to find the global interior optimum.
program_language: "python"
primary_metric: "lift_to_drag_ratio"
initial_score: 12.59

seed_files:
  - "main.py"

evaluator:
  script: "evaluator.py"
  method: "evaluate"
